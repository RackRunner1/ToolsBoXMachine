name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate release tag
        id: tag
        run: |
          TODAY=$(date +%Y%m%d)
          echo "Today: $TODAY"

          EXISTING_TAGS=$(git tag --list "${TODAY}*" --sort=-version:refname 2>/dev/null || true)

          if [ -z "$EXISTING_TAGS" ]; then
            NEXT_NUM="01"
            LAST_TAG=""
          else
            LAST_TAG=$(echo "$EXISTING_TAGS" | head -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed "s/^${TODAY}//")
            NEXT_NUM=$(printf "%02d" $((10#$LAST_NUM + 1)))
          fi

          TAG="${TODAY}${NEXT_NUM}"
          echo "Tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LAST_TAG: ${{ steps.tag.outputs.last_tag }}
        run: |
          OUTPUT_FILE=$(mktemp)
          FIX_FILE=$(mktemp)
          FEAT_FILE=$(mktemp)
          REFACTOR_FILE=$(mktemp)
          PERF_FILE=$(mktemp)
          STYLE_FILE=$(mktemp)
          CHORE_FILE=$(mktemp)
          DOCS_FILE=$(mktemp)
          CI_FILE=$(mktemp)
          TEST_FILE=$(mktemp)
          OTHER_FILE=$(mktemp)

          # Write header
          {
            echo "# 🪟 Build Name: ${TAG}"
            echo ""
            echo "## 🌟 What's Changed"
            echo ""
          } > "$OUTPUT_FILE"

          # Get commits and parse (use process substitution to avoid subshell)
          COMMIT_REGEX='^([a-zA-Z]+)(\(([^)]+)\))?!?:\ (.+)$'

          while IFS='|' read -r HASH MSG; do
            [ -z "$HASH" ] && continue
            SHORT="${HASH:0:7}"

            if [[ "$MSG" =~ $COMMIT_REGEX ]]; then
              TYPE="${BASH_REMATCH[1]}"
              SCOPE="${BASH_REMATCH[3]}"
              COMMIT_MSG="${BASH_REMATCH[4]}"

              if [ -n "$SCOPE" ]; then
                LINE="- ${TYPE}(${SCOPE}): ${COMMIT_MSG} (\`${SHORT}\`)"
              else
                LINE="- ${TYPE}: ${COMMIT_MSG} (\`${SHORT}\`)"
              fi

              case "${TYPE,,}" in
                feat)     echo "$LINE" >> "$FEAT_FILE" ;;
                fix)      echo "$LINE" >> "$FIX_FILE" ;;
                chore)    echo "$LINE" >> "$CHORE_FILE" ;;
                docs)     echo "$LINE" >> "$DOCS_FILE" ;;
                style)    echo "$LINE" >> "$STYLE_FILE" ;;
                refactor) echo "$LINE" >> "$REFACTOR_FILE" ;;
                perf)     echo "$LINE" >> "$PERF_FILE" ;;
                ci)       echo "$LINE" >> "$CI_FILE" ;;
                test)     echo "$LINE" >> "$TEST_FILE" ;;
                *)        echo "$LINE" >> "$OTHER_FILE" ;;
              esac
            else
              echo "- ${MSG} (\`${SHORT}\`)" >> "$OTHER_FILE"
            fi
          done < <(if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:"%H|%s" --no-merges
          else
            git log --pretty=format:"%H|%s" --no-merges
          fi)

          # Append sections in order
          append_section() {
            local file="$1"
            local title="$2"
            if [ -s "$file" ]; then
              echo "### $title" >> "$OUTPUT_FILE"
              echo "" >> "$OUTPUT_FILE"
              cat "$file" >> "$OUTPUT_FILE"
              echo "" >> "$OUTPUT_FILE"
            fi
          }

          append_section "$FIX_FILE" "🐛 Fixed"
          append_section "$FEAT_FILE" "➕ Added"
          append_section "$REFACTOR_FILE" "♻️ Refactored"
          append_section "$PERF_FILE" "⚡ Performance"
          append_section "$STYLE_FILE" "💄 Style"
          append_section "$CHORE_FILE" "🔧 Chores"
          append_section "$DOCS_FILE" "📚 Documentation"
          append_section "$CI_FILE" "🔄 CI"
          append_section "$TEST_FILE" "✅ Tests"
          append_section "$OTHER_FILE" "📦 Other"

          # Cleanup temp files
          rm -f "$FIX_FILE" "$FEAT_FILE" "$REFACTOR_FILE" "$PERF_FILE" "$STYLE_FILE" "$CHORE_FILE" "$DOCS_FILE" "$CI_FILE" "$TEST_FILE" "$OTHER_FILE"

          # Output using delimiter
          {
            echo "body<<RELEASEEOF"
            cat "$OUTPUT_FILE"
            echo "RELEASEEOF"
          } >> "$GITHUB_OUTPUT"

          rm -f "$OUTPUT_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          generate_release_notes: false
