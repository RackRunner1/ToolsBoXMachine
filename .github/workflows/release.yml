name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TODAY=$(date +%Y%m%d)
          echo "=== Debug Info ==="
          echo "Today: $TODAY"
          echo "All tags:"
          git tag -l

          # Edition name from edition.txt (falls back to empty if missing)
          EDITION=""
          if [ -f edition.txt ]; then
            EDITION=$(head -n1 edition.txt | tr -d '\r' | xargs)
          fi
          echo "Edition: $EDITION"

          # Lowercase, tag-safe copy of the edition, used as unique tag suffix
          TAG_EDITION=""
          if [ -n "$EDITION" ]; then
            TAG_EDITION=$(printf '%s' "$EDITION" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/[-.]+$//')
          fi
          echo "Tag edition suffix: $TAG_EDITION"

          # With an edition: today's tags of THIS edition (yyyyMMddNN-edition).
          # The counter restarts at 01 for each edition each day.
          if [ -n "$TAG_EDITION" ]; then
            TODAY_TAGS=$(git tag -l | while IFS= read -r t; do
              case "$t" in
                "${TODAY}"[0-9][0-9]-"$TAG_EDITION") printf '%s\n' "$t" ;;
              esac
            done | sort -r)
          else
            # Without an edition: shared counter for the day (legacy yyyyMMddNN)
            TODAY_TAGS=$(git tag -l "${TODAY}*" | grep -E "^${TODAY}[0-9]{2}$" | sort -r || true)
          fi
          echo "Today tags: $TODAY_TAGS"

          MAX_NUM=0
          if [ -n "$TODAY_TAGS" ]; then
            LAST_TODAY_TAG=$(echo "$TODAY_TAGS" | head -n1)
            LAST_NUM="${LAST_TODAY_TAG#${TODAY}}"
            if [ -n "$TAG_EDITION" ]; then
              LAST_NUM="${LAST_NUM%"-$TAG_EDITION"}"
            fi
            MAX_NUM="$LAST_NUM"
          fi
          NEXT_NUM=$(printf "%02d" $((10#$MAX_NUM + 1)))

          # Most recent tag overall (by tag date) for commit range
          LAST_TAG=$(git for-each-ref refs/tags --sort=refname --sort=-creatordate --format='%(refname:short)' | head -n1)
          echo "Last tag: $LAST_TAG"

          TAG_NUM="${TODAY}${NEXT_NUM}"
          if [ -n "$TAG_EDITION" ]; then
            TAG="${TAG_NUM}-${TAG_EDITION}"
          else
            TAG="$TAG_NUM"
          fi
          echo "New tag: $TAG"

          # Release name keeps the yyyyMMddNN + edition styling
          if [ -n "$EDITION" ]; then
            RELEASE_NAME="${TAG_NUM} (${EDITION} Edition)"
          else
            RELEASE_NAME="$TAG"
          fi
          echo "Release name: $RELEASE_NAME"

          # Set outputs
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NAME: ${{ steps.tag.outputs.release_name }}
          LAST_TAG: ${{ steps.tag.outputs.last_tag }}
        run: |
          echo "=== Generating notes ==="
          echo "TAG: $TAG"
          echo "RELEASE_NAME: $RELEASE_NAME"
          echo "LAST_TAG: $LAST_TAG"

          OUTPUT_FILE=$(mktemp)
          FIX_FILE=$(mktemp)
          FEAT_FILE=$(mktemp)
          REFACTOR_FILE=$(mktemp)
          PERF_FILE=$(mktemp)
          STYLE_FILE=$(mktemp)
          CHORE_FILE=$(mktemp)
          DOCS_FILE=$(mktemp)
          CI_FILE=$(mktemp)
          TEST_FILE=$(mktemp)
          OTHER_FILE=$(mktemp)

          # Write header
          {
            echo "# 🪟 Build Name: ${RELEASE_NAME}"
            echo ""
            echo "## 🌟 What's Changed"
            echo ""
          } > "$OUTPUT_FILE"

          # Get commits since last tag
          COMMIT_REGEX='^([a-zA-Z]+)(\(([^)]+)\))?!?:\ (.+)$'

          if [ -n "$LAST_TAG" ]; then
            echo "Commits since $LAST_TAG:"
            git log "${LAST_TAG}..HEAD" --pretty=tformat:"%H|%s" --no-merges | head -5
          else
            echo "No last tag, showing all commits"
          fi

          while IFS='|' read -r HASH MSG; do
            [ -z "$HASH" ] && continue
            SHORT="${HASH:0:7}"

            if [[ "$MSG" =~ $COMMIT_REGEX ]]; then
              TYPE="${BASH_REMATCH[1]}"
              SCOPE="${BASH_REMATCH[3]}"
              COMMIT_MSG="${BASH_REMATCH[4]}"

              if [ -n "$SCOPE" ]; then
                LINE="- ${TYPE}(${SCOPE}): ${COMMIT_MSG} (\`${SHORT}\`)"
              else
                LINE="- ${TYPE}: ${COMMIT_MSG} (\`${SHORT}\`)"
              fi

              case "${TYPE,,}" in
                feat)     echo "$LINE" >> "$FEAT_FILE" ;;
                remove)   echo "$LINE" >> "$FEAT_FILE" ;;
                fix)      echo "$LINE" >> "$FIX_FILE" ;;
                chore)    echo "$LINE" >> "$CHORE_FILE" ;;
                docs)     echo "$LINE" >> "$DOCS_FILE" ;;
                style)    echo "$LINE" >> "$STYLE_FILE" ;;
                refactor) echo "$LINE" >> "$REFACTOR_FILE" ;;
                perf)     echo "$LINE" >> "$PERF_FILE" ;;
                ci)       echo "$LINE" >> "$CI_FILE" ;;
                test)     echo "$LINE" >> "$TEST_FILE" ;;
                *)        echo "$LINE" >> "$OTHER_FILE" ;;
              esac
            else
              echo "- ${MSG} (\`${SHORT}\`)" >> "$OTHER_FILE"
            fi
          done < <(if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=tformat:"%H|%s" --no-merges
          else
            git log --pretty=tformat:"%H|%s" --no-merges
          fi)

          # Append sections in order
          append_section() {
            local file="$1"
            local title="$2"
            if [ -s "$file" ]; then
              echo "### $title" >> "$OUTPUT_FILE"
              echo "" >> "$OUTPUT_FILE"
              cat "$file" >> "$OUTPUT_FILE"
              echo "" >> "$OUTPUT_FILE"
            fi
          }

          append_section "$FIX_FILE" "🐛 Fixed"
          append_section "$FEAT_FILE" "➕ Added or Removed"
          append_section "$REFACTOR_FILE" "♻️ Refactored"
          append_section "$PERF_FILE" "⚡ Performance"
          append_section "$STYLE_FILE" "💄 Style"
          append_section "$CHORE_FILE" "🔧 Chores"
          append_section "$DOCS_FILE" "📚 Documentation"
          append_section "$CI_FILE" "🔄 CI"
          append_section "$TEST_FILE" "✅ Tests"
          append_section "$OTHER_FILE" "📦 Other"

          # Cleanup temp files
          rm -f "$FIX_FILE" "$FEAT_FILE" "$REFACTOR_FILE" "$PERF_FILE" "$STYLE_FILE" "$CHORE_FILE" "$DOCS_FILE" "$CI_FILE" "$TEST_FILE" "$OTHER_FILE"

          # Output using delimiter
          {
            echo "body<<RELEASEEOF"
            cat "$OUTPUT_FILE"
            echo "RELEASEEOF"
          } >> "$GITHUB_OUTPUT"

          rm -f "$OUTPUT_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          generate_release_notes: false
