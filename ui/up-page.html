<style>
  .up-page-btn {
    position: fixed;
    right: 1.5rem;
    bottom: 1.5rem;
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background-color: var(--card-bg);
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: translateY(1rem) scale(0.8);
    pointer-events: none;
    transition:
      opacity 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      background-color 0.4s ease,
      border-color 0.4s ease,
      box-shadow 0.4s ease;
    z-index: 1000;
  }

  .up-page-btn.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .up-page-btn.visible:hover {
    transform: translateY(-4px) scale(1.05);
    border-color: var(--primary-color);
    background-color: var(--card-hover-bg);
    box-shadow:
      0 20px 40px -15px rgba(0, 0, 0, 0.5),
      0 0 20px rgba(59, 130, 246, 0.2);
  }
</style>

<button type="button" class="up-page-btn" id="up-page-btn" aria-label="Back to top" title="Back to top">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6"></path>
  </svg>
</button>

<script>
  (() => {
    const btn = document.getElementById("up-page-btn");
    const baseBottom = parseFloat(getComputedStyle(btn).bottom);

    const toggle = () => {
      btn.classList.toggle("visible", window.scrollY > 300);
    };

    const pushAboveFooter = () => {
      const footer = document.querySelector(".footer");
      const overlap = footer ? window.innerHeight - footer.getBoundingClientRect().top : 0;
      btn.style.bottom = overlap > 0 ? `${baseBottom + overlap}px` : "";
    };

    const update = () => {
      toggle();
      pushAboveFooter();
    };

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    document.addEventListener("components-loaded", update);
    btn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    update();
  })();
</script>
