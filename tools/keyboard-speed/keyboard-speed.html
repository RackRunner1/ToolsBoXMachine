    <meta

      content="Test your typing speed and accuracy with this free online keyboard speed test."

    <style>
      .typing-layout {
        width: 100%;
        max-width: 900px;
        margin: 1rem auto 4rem;
        padding: 0 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .typing-card {
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1.25rem;
        padding: 2rem 2.25rem;
        min-height: 180px;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.3),
          inset 0 0 40px rgba(255, 255, 255, 0.02);
        cursor: text;
        overflow: hidden;
      }

      .typing-text {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        line-height: 1.9;
        color: #64748b;
        word-break: break-word;
        user-select: none;
        position: relative;
        z-index: 1;
      }

      .typing-text span {
        color: #64748b;
        transition: color 0.12s ease;
      }

      .typing-text span.done {
        color: #f8fafc;
      }

      .typing-text span.current {
        color: #94a3b8;
      }

      .typing-caret {
        position: absolute;
        height: 5px;
        background: var(--primary-color);
        border-radius: 3px;
        box-shadow: 0 0 16px var(--primary-glow);
        transition:
          left 0.16s ease,
          top 0.16s ease,
          width 0.16s ease,
          opacity 0.2s ease;
        pointer-events: none;
        z-index: 2;
        opacity: 0;
      }

      .typing-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
        top: 0;
        left: 0;
      }

      .typing-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .typing-stats-live {
        display: flex;
        gap: 1.5rem;
        color: #94a3b8;
        font-size: 0.95rem;
      }

      .typing-stats-live strong {
        color: #f8fafc;
        font-family: var(--font-mono);
      }

      .typing-hint {
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
      }

      .results-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .results-modal.show {
        display: flex;
        opacity: 1;
      }

      .results-panel {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 2rem;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transform: scale(0.95);
        transition: transform 0.3s ease;
      }

      .results-modal.show .results-panel {
        transform: scale(1);
      }

      .results-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .results-icon {
        background: rgba(59, 130, 246, 0.2);
        padding: 0.75rem;
        border-radius: 0.75rem;
        color: var(--primary-color);
      }

      .results-title {
        margin: 0;
        font-size: 1.5rem;
        color: white;
      }

      .results-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .result-card {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 0.75rem;
        padding: 1rem;
        text-align: center;
      }

      .result-value {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--primary-color);
        font-family: var(--font-mono);
      }

      .result-label {
        font-size: 0.8rem;
        color: #94a3b8;
        margin-top: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .results-actions {
        display: flex;
        gap: 0.75rem;
      }

      .results-actions .btn {
        flex: 1;
      }

      @media (max-width: 600px) {
        .typing-text {
          font-size: 1.2rem;
        }
        .typing-card {
          padding: 1.25rem;
        }
      }
    </style>

  <body class="tool-page">
    <div id="navbar-placeholder"></div>

    <div class="hero-section">
      <h1 class="page-title">Typing Speed Test</h1>
      <p class="subtitle">Type the text as fast and accurately as you can.</p>
    </div>

    <div class="typing-layout">
      <div class="typing-card" id="typing-card">

    <div id="results-modal" class="results-modal" role="dialog" aria-modal="true" aria-labelledby="results-title">

          </div>
          <div class="result-card">
            <div class="result-value" id="res-time">0.0s</div>

          </div>
          <div class="result-card">
            <div class="result-value" id="res-errors">0</div>
            <div class="result-label">Errors</div>
          </div>
        </div>
        <div class="results-actions">
          <button class="btn btn-secondary" id="results-close">Close</button>
