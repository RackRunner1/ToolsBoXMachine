    <style>
      .emoji-container {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
      }

      .tabs-slider-wrapper {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
      }

      .tab-arrow {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e293b;
        border: 1px solid var(--card-border);
        border-radius: 0.5rem;
        color: #94a3b8;
        font-size: 1.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
        line-height: 1;
      }

      .tab-arrow:hover {
        border-color: var(--primary-color);
        color: #e2e8f0;
      }

      .tab-arrow:active {
        background: #334155;
      }

      .category-tabs {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-behavior: smooth;
        flex-wrap: nowrap;
        padding: 0.25rem 0;
        -ms-overflow-style: none;
        scrollbar-width: none;
        min-width: 0;
        flex: 1;
      }

      .category-tabs::-webkit-scrollbar {
        display: none;
      }

      .category-tab {
        flex-shrink: 0;
        background: #1e293b;
        border: 1px solid var(--card-border);
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        color: #94a3b8;
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .category-tab:hover {
        border-color: var(--primary-color);
        color: #e2e8f0;
      }

      .category-tab.active {
        background: var(--primary-color);
        color: #0f172a;
        border-color: var(--primary-color);
        font-weight: 600;
      }

      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
        gap: 0.5rem;
        background: #0f172a;
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 1.25rem;
        min-height: 200px;
      }

      .emoji-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        aspect-ratio: 1;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.15s ease;
        user-select: none;
        background: transparent;
      }

      .emoji-cell:hover {
        background: #1e293b;
        transform: scale(1.15);
      }

      .emoji-cell:active {
        transform: scale(0.95);
      }

      .emoji-cell.unsupported {
        opacity: 0.15;
        cursor: not-allowed;
        pointer-events: none;
        filter: grayscale(1);
      }

      .emoji-cell.copied {
        background: #10b981;
        animation: pop 0.3s ease;
      }

      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
      }

      #toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        background: #10b981;
        color: #0f172a;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1000;
      }

      #toast.show {
        opacity: 1;
      }

      .emoji-search-wrapper {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
      }

      #emoji-search {
        width: 100%;
        background: #1e293b;
        border: 1px solid var(--card-border);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        color: #e2e8f0;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s ease;
        box-sizing: border-box;
      }

      #emoji-search:focus {
        border-color: var(--primary-color);
      }

      #emoji-search::placeholder {
        color: #64748b;
      }
    </style>
  </head>
