<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create, save, and manage your notes locally in your browser."
    />
    <meta
      name="keywords"
      content="notes, notepad, text editor, save notes, tbxm, toolsboxmachine"
    />
    <title>Notes (TBXM)</title>
    <link rel="icon" href="../../.assets/logo/fav.png" />
    <link rel="stylesheet" href="../../style.css" />
    <style>
      .notes-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 1.5rem;
        width: 100%;
        max-width: none;
        margin: 1rem auto 4rem;
        padding: 0 2rem;
        height: calc(100vh - 14rem);
        min-height: 500px;
        animation: fadeIn 0.6s ease-out;
      }

      @media (max-width: 768px) {
        .notes-layout {
          grid-template-columns: 1fr;
          grid-template-rows: 260px 1fr;
          height: calc(100vh - 8rem);
          min-height: 400px;
          margin: 0.5rem auto 2rem;
          padding: 0 1rem;
        }
      }

      /* Main editor area */
      .notes-main {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1.25rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        width: 100%;
        min-width: 0;
      }

      .notes-main-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        gap: 1rem;
        background: rgba(15, 23, 42, 0.8);
      }

      .note-title-input {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        font-size: 1.35rem;
        font-weight: 600;
        outline: none;
        font-family: inherit;
      }

      .note-title-input::placeholder {
        color: #475569;
      }

      .note-date-display {
        font-size: 0.8rem;
        color: #64748b;
        white-space: nowrap;
      }

      .delete-note-btn {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        padding: 0.4rem;
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }

      .delete-note-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }

      .note-content-input {
        flex: 1;
        background: transparent;
        border: none;
        color: #e2e8f0;
        font-size: 1rem;
        line-height: 1.7;
        padding: 1.5rem;
        outline: none;
        resize: none;
        font-family: inherit;
        overflow-y: auto;
      }

      .note-content-input::placeholder {
        color: #475569;
      }

      .editor-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: #475569;
        padding: 2rem;
      }

      .editor-empty h3 {
        color: #64748b;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .editor-empty p {
        font-size: 0.9rem;
        color: #475569;
      }

      /* Sidebar */
      .notes-sidebar {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1.25rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        min-width: 0;
      }

      .sidebar-header {
        padding: 1.25rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(15, 23, 42, 0.8);
      }

      .new-note-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.7rem 1rem;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .new-note-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .notes-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
      }

      .notes-list::-webkit-scrollbar {
        width: 4px;
      }

      .notes-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .notes-list::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 2px;
      }

      .note-item {
        padding: 0.85rem 1rem;
        border-radius: 0.75rem;
        cursor: pointer;
        transition: all 0.15s;
        border: 1px solid transparent;
        margin-bottom: 0.25rem;
      }

      .note-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .note-item.active {
        background: rgba(59, 130, 246, 0.1);
        border-color: rgba(59, 130, 246, 0.3);
      }

      .note-item-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: white;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.2rem;
      }

      .note-item-preview {
        font-size: 0.8rem;
        color: #64748b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.2rem;
      }

      .note-item-date {
        font-size: 0.7rem;
        color: #475569;
      }

      .sidebar-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem 1rem;
        color: #475569;
        text-align: center;
      }

      .sidebar-empty svg {
        color: #334155;
      }

      .sidebar-empty p {
        font-size: 0.85rem;
        line-height: 1.5;
      }

      /* Notification */
      .notification {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--primary-color);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10000;
        font-weight: 500;
      }

      .notification.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Notes",
  "url": "https://tbxm.pages.dev/tools/note/note.html",
  "description": "Create, save, and manage your notes locally.",
  "applicationCategory": "ProductivityApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "creator": { "@type": "Person", "name": "RackRunner" }
}
</script>
    <meta name="description" content="Create, save, and manage notes locally in your browser. Free, private notes app — no account needed." />
    <meta name="content-signal" content="ai-train, ai-input, search" />
    <link rel="canonical" href="https://tbxm.pages.dev/tools/note/note.html" />
  </head>

  <body>
    <div id="navbar-placeholder"></div>

    <div class="hero-section">
      <h1 class="page-title">Notes</h1>
      <p class="subtitle">Create, save, and manage your notes locally in your browser.</p>
    </div>

    <div class="notes-layout">
      <!-- Sidebar -->
      <div class="notes-sidebar">
        <div class="sidebar-header">
          <button class="new-note-btn" id="create-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
            New Note
          </button>
        </div>
        <div class="notes-list" id="notes-list"></div>
      </div>

      <!-- Main editor -->
      <div class="notes-main" id="notes-main">
        <div class="editor-empty" id="editor-empty">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
          <h3>No note selected</h3>
          <p>Create a new note or select one from the sidebar</p>
        </div>

        <div id="editor-view" style="display:none; flex-direction:column; flex:1; width:100%;">
          <div class="notes-main-header">
            <input
              type="text"
              id="note-title"
              class="note-title-input"
              placeholder="Note Title"
            />
            <span class="note-date-display" id="note-date"></span>
            <button class="delete-note-btn" id="delete-btn" title="Delete note">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              </svg>
            </button>
          </div>
          <textarea
            id="note-content"
            class="note-content-input"
            placeholder="Start writing..."
          ></textarea>
        </div>
      </div>

    </div>

    <div id="notification" class="notification"></div>

    <script type="module" src="./note.js"></script>
    <div id="footer-placeholder"></div>
    <script src="/ui/include.js"></script>
    <script src="/ui/navbar.js"></script>
  </body>
</html>
