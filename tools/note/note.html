      content="Create, save, and manage your notes locally in your browser."

    <style>
      .notes-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .notes-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.4);
        padding: 1rem 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .note-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 1.25rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: 200px;
        position: relative;
        overflow: hidden;
      }

      .note-card:hover {
        transform: translateY(-5px);
        background: rgba(15, 23, 42, 0.8);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }

      .note-card-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: white;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .note-card-content {
        font-size: 0.9rem;
        color: #94a3b8;
        line-height: 1.5;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
        flex-grow: 1;
        word-break: break-word;
      }

      .note-card-date {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: auto;
      }

      .delete-note-btn {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: none;
        border-radius: 0.5rem;
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.2s,
          background 0.2s;
        z-index: 10;
      }

      .note-card:hover .delete-note-btn {
        opacity: 1;
      }

      .delete-note-btn:hover {
        background: rgba(239, 68, 68, 0.4);
      }

      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        background: rgba(15, 23, 42, 0.4);
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        color: #94a3b8;
        grid-column: 1 / -1;
      }

      .empty-state svg {
        margin-bottom: 1rem;
        color: #475569;
      }

      /* Modal Styling */
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .modal-backdrop.active {
        display: flex;
        opacity: 1;
      }

      .modal-content {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        width: 90%;
        max-width: 600px;
        height: 80vh;
        max-height: 800px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transform: scale(0.95);
        transition: transform 0.3s ease;
        overflow: hidden;
      }

      .modal-backdrop.active .modal-content {
        transform: scale(1);
      }

      .modal-header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 1);
      }

      .modal-body {
        padding: 1.5rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow-y: auto;
      }

      .modal-footer {
        padding: 1.25rem 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        background: rgba(15, 23, 42, 1);
      }

      .note-input-title {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.5rem;
        font-weight: 600;
        outline: none;
        width: 100%;
        font-family: inherit;
      }

      .note-input-title::placeholder {
        color: #475569;
      }

      .note-input-content {
        background: transparent;
        border: none;
        color: #e2e8f0;
        font-size: 1rem;
        line-height: 1.6;
        outline: none;
        width: 100%;
        flex-grow: 1;
        resize: none;
        font-family: inherit;
      }

      .note-input-content::placeholder {
        color: #475569;
      }

      .close-btn {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .btn-icon {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* Notification */
      .notification {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--primary-color);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10000;
        font-weight: 500;
      }

      .notification.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>

  <body>

</div>
    <h1>Notes</h1>

    <div class="notes-container">
      <div class="notes-header">
        <div>
          <h2 style="margin: 0; font-size: 1.25rem">My Notes</h2>
          <p
            style="
              margin: 0;
              font-size: 0.85rem;
              color: #94a3b8;
              margin-top: 0.25rem;
            "
          >
            Stored securely in your browser
          </p>
        </div>
        <button class="btn btn-primary btn-icon" id="create-note-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
          New Note
        </button>
      </div>

      <div class="notes-grid" id="notes-grid">
        <!-- Notes will be rendered here -->
      </div>
    </div>

    <!-- Note Modal -->
    <div class="modal-backdrop" id="note-modal">
      <div class="modal-content">
        <div class="modal-header">
          <input
            type="text"
            id="modal-note-title"
            class="note-input-title"
            placeholder="Note Title"
          />
          <button class="close-btn" id="close-modal-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <textarea
            id="modal-note-content"
            class="note-input-content"
            placeholder="Start writing..."
          ></textarea>
        </div>
        <div class="modal-footer">
          <span
            id="modal-note-date"
            style="
              color: #64748b;
              font-size: 0.85rem;
              margin-right: auto;
              align-self: center;
            "
          ></span>
          <button class="btn btn-secondary" id="cancel-note-btn">Cancel</button>
          <button class="btn btn-primary btn-icon" id="save-note-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            Save Note
          </button>
        </div>
      </div>
    </div>

    <div id="notification" class="notification">Note saved!</div>

    <script type="module" src="./note.js"></script>
